# Dependabot: weekly grouped updates (security alerts still open ASAP via GitHub).
version: 2
updates:
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint@8 的 peer 范围是 typescript <6.1，TS 6/7 大版本会 ERESOLVE；
      # 待 typescript-eslint 跟进后删除本条，TS 大版本升级手动处理。
      - dependency-name: typescript
        versions: ">= 6"
    groups:
      extension-deps:
        patterns:
          - '*'
    labels:
      - dependencies
      - extension

  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      server-deps:
        patterns:
          - '*'
    labels:
      - dependencies
      - server

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - dependencies
      - ci

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
